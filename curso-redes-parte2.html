<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso Avançado de Redes de Computadores - Parte 2</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #090d16;
      --foreground: #f1f5f9;
      --card: #111827;
      --card-hover: #1f2937;
      --border: #1e293b;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --secondary: #818cf8;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --warning: #f59e0b;
      --muted-foreground: #94a3b8;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow-x: hidden;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
    .animate-fadeIn {
      animation: fadeIn 0.45s ease-out both;
    }
    .glass-panel {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
    }
    .terminal-cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #38bdf8;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .bit-badge {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bit-badge:hover {
      transform: translateY(-2px);
    }
    .tab-active {
      border-bottom: 2px solid var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    /* Technical Term Tooltips */
    .tech-term {
      position: relative;
      cursor: help;
      border-bottom: 1px dashed rgba(56, 189, 248, 0.5);
      color: #7dd3fc;
      transition: all 0.2s ease;
    }
    .tech-term:hover {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }
    .tech-tooltip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 260px;
      max-width: 360px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.1);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 9999;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
      white-space: normal;
    }
    .tech-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: rgba(56, 189, 248, 0.3);
    }
    .tech-tooltip .tooltip-title {
      font-weight: 700;
      color: #38bdf8;
      font-size: 13px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tech-tooltip .tooltip-title::before {
      content: '💡';
      font-size: 14px;
    }
    .tech-term:hover .tech-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] min-h-screen flex flex-col antialiased selection:bg-sky-500/30 selection:text-sky-200">

  <!-- Top Navigation Bar -->
  <header class="glass-panel sticky top-0 z-50 border-b border-[var(--border)] px-4 lg:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button id="toggle-sidebar" class="lg:hidden p-2 rounded-lg bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] hover:text-[var(--primary)] transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 font-black text-white text-lg">
          R2
        </div>
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-sky-400">Curso de Tecnologia da Informação</span>
          <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-2">
            Redes de Computadores <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30">Parte 2 — Módulos 9 a 17</span>
          </h1>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-[11px] text-slate-400">Instrutor:</span>
            <span class="text-[11px] font-semibold text-emerald-400 flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              Prof. César
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Overall Progress and Stats -->
    <div class="flex items-center gap-4">
      <div class="hidden md:flex flex-col items-end">
        <div class="flex items-center gap-2 text-xs text-[var(--muted-foreground)]">
          <span>Progresso do Curso:</span>
          <span id="progress-percentage" class="font-bold text-sky-400">0%</span>
        </div>
        <div class="w-36 h-2 bg-slate-800 rounded-full overflow-hidden mt-1 border border-slate-700/50">
          <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-sky-500 to-emerald-400 transition-all duration-500 w-0"></div>
        </div>
      </div>
      <button onclick="resetAllProgress()" title="Reiniciar Progresso" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 border border-slate-800 transition">
        Resetar
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 flex max-w-[1920px] w-full mx-auto relative">
    
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="fixed lg:sticky top-[61px] left-0 h-[calc(100vh-61px)] w-72 lg:w-80 glass-panel border-r border-[var(--border)] z-40 transition-transform duration-300 -translate-x-full lg:translate-x-0 flex flex-col">
      <div class="p-4 border-b border-[var(--border)]">
        <h2 class="text-xs font-semibold text-[var(--muted-foreground)] uppercase tracking-wider">Módulos do Curso</h2>
        <p class="text-xs text-slate-400 mt-0.5">Clique para navegar pelas aulas práticas</p>
      </div>

      <nav class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1.5" id="modules-nav">
        <!-- Navigation items injected via JS -->
      </nav>

      <div class="p-4 border-t border-[var(--border)] bg-slate-900/40">
        <div class="flex flex-col gap-1.5 text-xs text-slate-400">
          <div class="flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Modo Interativo
            </span>
            <span class="text-[10px] text-slate-500 font-mono">PT-BR</span>
          </div>
          <div class="text-center text-[10px] text-slate-500 border-t border-slate-800 pt-1.5 mt-0.5">
            Tecnologia da Informação &bull; Prof. César
          </div>
        </div>
      </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden lg:hidden"></div>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0 p-4 lg:p-8 overflow-y-auto custom-scrollbar" id="content-container">
      <!-- Active module rendered here -->
      <div id="module-content" class="max-w-5xl mx-auto space-y-8">
        <!-- Content inserted dynamically -->
      </div>
    </main>

  </div>

  <!-- Placeholder for Module Scripts and Data -->
  <script>
    // ===== Registro dos módulos (renderizadores e inicializadores) =====
    const MODULE_RENDERERS = {};
    const MODULE_INITS = {};

    // Course Global State
    const COURSE_STATE = {
      activeModule: 9,
      completedModules: JSON.parse(localStorage.getItem('redes_course_completed') || '[]'),
      quizScores: JSON.parse(localStorage.getItem('redes_course_scores') || '{}')
    };

    const MODULES = [
      { id: 9, title: "9. Equipamentos Ativos", subtitle: "Hub, Switch, Roteador, AP e Firewall", icon: "🔌" },
      { id: 10, title: "10. Endereçamento IPv4", subtitle: "Binário, Classes A-E, Público x Privado", icon: "🌐" },
      { id: 11, title: "11. Sub-redes e Configurações", subtitle: "THE MEGA SUBNET SIMULATOR & Calculadora", icon: "⚡" },
      { id: 12, title: "12. Fundamentos de WiFi", subtitle: "RF, Frequências 2.4/5/6GHz e Canais", icon: "📶" },
      { id: 13, title: "13. Tipos de WiFi", subtitle: "Padrões 802.11a/b/g/n/ac/ax/be e Linha do Tempo", icon: "🚀" },
      { id: 14, title: "14. Configuração de Rede WiFi", subtitle: "Laboratório Interativo de Roteador Wi-Fi", icon: "⚙️" },
      { id: 15, title: "15. Compartilhamento de Recursos", subtitle: "Arquivos, Impressão e Serviços em Nuvem", icon: "📁" },
      { id: 16, title: "16. Comandos de Rede", subtitle: "Terminal Interativo (ping, tracert, ipconfig...)", icon: "💻" },
      { id: 17, title: "17. Segurança Básica em Redes", subtitle: "Ameaças, Criptografia, VPN e WPA3", icon: "🛡️" }
    ];

    function saveState() {
      localStorage.setItem('redes_course_completed', JSON.stringify(COURSE_STATE.completedModules));
      localStorage.setItem('redes_course_scores', JSON.stringify(COURSE_STATE.quizScores));
      updateProgressDisplay();
    }

    function updateProgressDisplay() {
      const percentage = Math.round((COURSE_STATE.completedModules.length / MODULES.length) * 100);
      const percentEl = document.getElementById('progress-percentage');
      const barEl = document.getElementById('progress-bar-fill');
      if (percentEl) percentEl.innerText = `${percentage}%`;
      if (barEl) barEl.style.width = `${percentage}%`;
      renderNav();
    }

    function markModuleCompleted(id) {
      if (!COURSE_STATE.completedModules.includes(id)) {
        COURSE_STATE.completedModules.push(id);
        saveState();
      }
    }

    function resetAllProgress() {
      if (confirm('Deseja realmente reiniciar todo o progresso do curso?')) {
        COURSE_STATE.completedModules = [];
        COURSE_STATE.quizScores = {};
        saveState();
        renderNav();
        loadModule(COURSE_STATE.activeModule);
      }
    }

    function renderNav() {
      const nav = document.getElementById('modules-nav');
      if (!nav) return;
      nav.innerHTML = MODULES.map(m => {
        const isActive = m.id === COURSE_STATE.activeModule;
        const isDone = COURSE_STATE.completedModules.includes(m.id);
        return `
          <button onclick="loadModule(${m.id})" class="w-full text-left p-3 rounded-xl transition-all flex items-start gap-3 border ${
            isActive 
              ? 'bg-sky-500/15 border-sky-500/50 text-white shadow-lg shadow-sky-500/10' 
              : 'border-transparent text-slate-300 hover:bg-slate-800/60 hover:text-white'
          }">
            <span class="text-xl shrink-0 mt-0.5">${m.icon}</span>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <p class="text-xs font-bold truncate ${isActive ? 'text-sky-300' : 'text-slate-200'}">${m.title}</p>
                ${isDone ? '<span class="text-emerald-400 text-xs font-bold">✓</span>' : ''}
              </div>
              <p class="text-[11px] text-[var(--muted-foreground)] truncate mt-0.5">${m.subtitle}</p>
            </div>
          </button>
        `;
      }).join('');
    }

    // Mobile sidebar toggle
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-sidebar');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (toggleBtn && sidebar && overlay) {
        toggleBtn.addEventListener('click', () => {
          sidebar.classList.toggle('-translate-x-full');
          overlay.classList.toggle('hidden');
        });
        overlay.addEventListener('click', () => {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden');
        });
      }
      renderNav();
      updateProgressDisplay();
      loadModule(9);
    });

    // Timers que podem sobreviver à troca de módulo (evita vazamento e animação em nó destacado)
    function clearModuleTimers() {
      if (typeof rfInterval !== 'undefined' && rfInterval) { clearInterval(rfInterval); rfInterval = null; }
      if (typeof threatInterval !== 'undefined' && threatInterval) { clearInterval(threatInterval); threatInterval = null; }
    }

    // ===== Navegação rápida entre módulos (rodapé + atalhos de teclado) =====
    function renderModuleFooterNav(id) {
      const idx = MODULES.findIndex(m => m.id === id);
      const prev = idx > 0 ? MODULES[idx - 1] : null;
      const next = idx < MODULES.length - 1 ? MODULES[idx + 1] : null;
      const total = MODULES.length;

      const styleOn = 'group flex-1 sm:flex-none flex items-center gap-3 px-5 py-3.5 rounded-2xl text-sm font-bold transition-all cursor-pointer';
      const stylePrev = `${styleOn} bg-slate-900/80 border border-slate-700 text-slate-200 hover:border-sky-500/60 hover:bg-slate-800 hover:-translate-y-0.5`;
      const styleNext = `${styleOn} bg-gradient-to-r from-sky-500 to-cyan-600 border border-sky-400/40 text-slate-950 shadow-lg shadow-sky-500/20 hover:from-sky-400 hover:to-cyan-500 hover:-translate-y-0.5`;
      const styleOff = `${styleOn} bg-slate-900/40 border border-slate-800 text-slate-600 cursor-not-allowed opacity-50`;

      const prevBtn = prev
        ? `<button onclick="loadModule(${prev.id})" title="Atalho: ←" class="${stylePrev}">
             <span class="text-lg leading-none group-hover:-translate-x-0.5 transition-transform">◀</span>
             <span class="text-left">
               <span class="block text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Anterior</span>
               <span class="block text-xs sm:text-sm">${prev.title}</span>
             </span>
           </button>`
        : `<button disabled title="Você está no primeiro módulo" class="${styleOff}">
             <span class="text-lg leading-none">◀</span>
             <span class="text-left">
               <span class="block text-[10px] uppercase tracking-wider text-slate-600 font-semibold">Anterior</span>
               <span class="block text-xs">Início do curso</span>
             </span>
           </button>`;

      const nextBtn = next
        ? `<button onclick="loadModule(${next.id})" title="Atalho: →" class="${styleNext}">
             <span class="text-left ml-auto">
               <span class="block text-[10px] uppercase tracking-wider text-sky-900/70 font-semibold">Próximo</span>
               <span class="block text-xs sm:text-sm">${next.title}</span>
             </span>
             <span class="text-lg leading-none group-hover:translate-x-0.5 transition-transform">▶</span>
           </button>`
        : `<button onclick="finishCourse()" title="Atalho: →" class="${styleNext} bg-gradient-to-r from-emerald-500 to-teal-500 border-emerald-400/40 shadow-lg shadow-emerald-500/20 hover:from-emerald-400 hover:to-teal-400">
             <span class="text-left ml-auto">
               <span class="block text-[10px] uppercase tracking-wider text-emerald-950/70 font-semibold">Fim da Parte 2</span>
               <span class="block text-xs sm:text-sm">Concluir o curso 🎉</span>
             </span>
             <span class="text-lg leading-none">🏆</span>
           </button>`;

      // Indicador de progresso por pontos
      const dots = MODULES.map((m, i) => {
        const isDone = COURSE_STATE.completedModules.includes(m.id);
        const isActive = i === idx;
        const color = isActive ? 'bg-sky-400 scale-125 ring-2 ring-sky-400/30'
          : isDone ? 'bg-emerald-400 hover:bg-emerald-300'
          : 'bg-slate-700 hover:bg-slate-500';
        const label = `${m.title}${isDone ? ' (concluído)' : ''}`;
        return `<button onclick="loadModule(${m.id})" title="${label}" aria-label="${label}" class="w-2 h-2 rounded-full ${color} transition-all"></button>`;
      }).join('');

      return `
        <div class="pt-4 pb-2 mt-4 border-t border-[var(--border)]">
          <div class="flex items-center justify-between gap-3 mb-4 px-1">
            <p class="text-[11px] font-semibold text-[var(--muted-foreground)] uppercase tracking-wider">
              Módulo ${idx + 1} de ${total}
            </p>
            <div class="flex items-center gap-2" id="module-dots">${dots}</div>
          </div>
          <div class="flex flex-col sm:flex-row gap-3">
            ${prevBtn}
            ${nextBtn}
          </div>
          <p class="text-[11px] text-slate-500 text-center mt-3 hidden sm:block">
            Dica: use as setas <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 font-mono text-slate-400">←</kbd>
            e <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 font-mono text-slate-400">→</kbd> para alternar entre módulos
          </p>
        </div>
      `;
    }

    function finishCourse() {
      const pending = MODULES.filter(m => !COURSE_STATE.completedModules.includes(m.id));
      if (pending.length === 0) {
        alert('🎉 Parabéns! Você concluiu todos os módulos da Parte 2.\n\nRetorne ao portal para iniciar a Parte 1 ou revisar o conteúdo.');
      } else {
        const lista = pending.map(m => '• ' + m.title).join('\n');
        alert(`Você chegou ao fim do conteúdo, mas ainda faltam ${pending.length} módulo(s):\n\n${lista}\n\nUse o quiz de cada módulo para registrar sua conclusão.`);
      }
    }

    // Atalhos de teclado: setas esquerda/direita (ignorando campos de texto)
    document.addEventListener('keydown', e => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const idx = MODULES.findIndex(m => m.id === COURSE_STATE.activeModule);
      const target = e.key === 'ArrowLeft' ? idx - 1 : idx + 1;
      if (target < 0 || target >= MODULES.length) return;
      e.preventDefault();
      loadModule(MODULES[target].id);
    });

    // Master dispatcher for module content
    function loadModule(id) {
      COURSE_STATE.activeModule = id;
      renderNav();
      const container = document.getElementById('module-content');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      clearModuleTimers();

      // Close mobile menu if open
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if (sidebar && overlay) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }

      if (MODULE_RENDERERS[id]) {
        container.innerHTML = MODULE_RENDERERS[id]() + renderModuleFooterNav(id);
        if (MODULE_INITS[id]) {
          setTimeout(() => MODULE_INITS[id](), 50);
        }
      } else {
        container.innerHTML = `<div class="p-8 text-center text-slate-400">Módulo em carregamento...</div>`;
      }
    }

  <!-- QUIZ ENGINE & MODULES 9 & 10 -->
    // Universal Quiz Generator
    function renderQuiz(moduleId, questions) {
      const savedScore = COURSE_STATE.quizScores[moduleId];
      return `
        <div class="mt-12 p-6 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 shadow-xl">
          <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-3">
              <span class="p-2 rounded-xl bg-sky-500/10 text-sky-400 border border-sky-500/20 text-lg">📝</span>
              <div>
                <h3 class="text-base font-bold text-white">Quiz de Fixação - Módulo ${moduleId}</h3>
                <p class="text-xs text-slate-400">Teste seus conhecimentos e valide seu aprendizado</p>
              </div>
            </div>
            <div id="quiz-badge-${moduleId}">
              ${savedScore !== undefined ? `<span class="px-3 py-1 rounded-full text-xs font-bold ${savedScore >= 2 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'}">Nota Anterior: ${savedScore}/${questions.length}</span>` : ''}
            </div>
          </div>

          <div class="space-y-6" id="quiz-questions-${moduleId}">
            ${questions.map((q, idx) => `
              <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 transition-all" id="quiz-card-${moduleId}-${idx}">
                <p class="text-sm font-semibold text-slate-200 mb-3"><span class="text-sky-400 font-mono mr-1.5">${idx + 1}.</span>${q.question}</p>
                <div class="space-y-2">
                  ${q.options.map((opt, optIdx) => `
                    <label class="flex items-center gap-3 p-3 rounded-lg bg-slate-950/50 hover:bg-slate-800/50 border border-slate-800 cursor-pointer transition text-xs text-slate-300 group">
                      <input type="radio" name="q-${moduleId}-${idx}" value="${optIdx}" class="text-sky-500 focus:ring-0 focus:ring-offset-0 bg-slate-900 border-slate-700">
                      <span class="group-hover:text-white transition">${opt}</span>
                    </label>
                  `).join('')}
                </div>

    function submitQuiz(moduleId, questions) {
      let score = 0;
      let allAnswered = true;

      questions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="q-${moduleId}-${idx}"]:checked`);
        const feedbackEl = document.getElementById(`feedback-${moduleId}-${idx}`);
        const cardEl = document.getElementById(`quiz-card-${moduleId}-${idx}`);

        if (!selected) {
          allAnswered = false;
          if (feedbackEl) {
            feedbackEl.className = "mt-3 p-3 rounded-lg text-xs bg-amber-500/10 text-amber-300 border border-amber-500/20 block";
            feedbackEl.innerText = "⚠️ Por favor, selecione uma alternativa.";
          }
          return;
        }

        const answer = parseInt(selected.value);
        if (answer === q.correct) {
          score++;
          cardEl.className = "p-4 rounded-xl bg-emerald-950/20 border border-emerald-500/40 transition-all";
          feedbackEl.className = "mt-3 p-3 rounded-lg text-xs bg-emerald-500/10 text-emerald-300 border border-emerald-500/30 block";
          feedbackEl.innerHTML = `<strong>Correto! ✓</strong> ${q.explanation}`;
        } else {
          cardEl.className = "p-4 rounded-xl bg-rose-950/20 border border-rose-500/40 transition-all";
          feedbackEl.className = "mt-3 p-3 rounded-lg text-xs bg-rose-500/10 text-rose-300 border border-rose-500/30 block";
          feedbackEl.innerHTML = `<strong>Incorreto! ✗</strong> Resposta correta: <em>${q.options[q.correct]}</em>. <br><span class="text-slate-400">${q.explanation}</span>`;
        }
      });

      if (!allAnswered) return;

      COURSE_STATE.quizScores[moduleId] = score;
      if (score >= Math.ceil(questions.length * 0.6)) {
        markModuleCompleted(moduleId);
      }
      saveState();

      const resultEl = document.getElementById(`quiz-result-${moduleId}`);
      if (resultEl) {
        resultEl.innerHTML = `
          <span class="px-3 py-1.5 rounded-lg ${score === questions.length ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-sky-500/20 text-sky-300 border border-sky-500/30'}">
            Resultado: <strong>${score} de ${questions.length}</strong> acertos (${Math.round((score/questions.length)*100)}%)
          </span>
        `;
      }
    }

    function updateSimScene() {
      const dev = document.getElementById('sim-device').value;
      const title = document.getElementById('center-title');
      const sub = document.getElementById('center-sub');
      const rect = document.getElementById('center-rect');
      if (!title || !sub || !rect) return;

      if (dev === 'hub') {
        title.innerText = 'HUB L1';
        sub.innerText = 'Difusão Cega (Repetidor)';
        title.setAttribute('fill', '#f59e0b');
        rect.setAttribute('stroke', '#f59e0b');
      } else if (dev === 'switch') {
        title.innerText = 'SWITCH L2';
        sub.innerText = 'Tabela CAM (MAC)';
        title.setAttribute('fill', '#38bdf8');
        rect.setAttribute('stroke', '#38bdf8');
      } else if (dev === 'router') {
        title.innerText = 'ROTEADOR L3';
        sub.innerText = 'Tabela de Rotas (IP)';
        title.setAttribute('fill', '#818cf8');
        rect.setAttribute('stroke', '#818cf8');
      } else if (dev === 'firewall') {
        title.innerText = 'FIREWALL SPI';
        sub.innerText = 'Inspeção de Estado';
        title.setAttribute('fill', '#ef4444');
        rect.setAttribute('stroke', '#ef4444');
      }
    }

    function runPacketSimulation() {
      const dev = document.getElementById('sim-device').value;
      const traffic = document.getElementById('sim-traffic').value;
      const packetsGroup = document.getElementById('animated-packets');
      const statusText = document.getElementById('sim-status-text');
      const statusBadge = document.getElementById('sim-status-badge');
      const btn = document.getElementById('btn-run-sim');

      if (!packetsGroup) return;
      btn.disabled = true;
      packetsGroup.innerHTML = '';

      // Create primary packet from PC1 (80, 70) to Center (300, 150)
      const p1 = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      p1.setAttribute('cx', '80');
      p1.setAttribute('cy', '70');
      p1.setAttribute('r', '7');
      p1.setAttribute('fill', traffic === 'malicious_probe' ? '#ef4444' : '#38bdf8');
      p1.setAttribute('filter', 'drop-shadow(0 0 6px currentColor)');
      packetsGroup.appendChild(p1);

      statusBadge.innerText = 'Transmitindo...';
      statusBadge.className = 'px-2 py-0.5 rounded text-[10px] font-mono bg-sky-500/20 text-sky-400';
      statusText.innerHTML = `<strong>PC 1:</strong> Transmitindo pacote para o dispositivo central...`;

      // Animate to center over 1.2s
      let progress = 0;
      const interval = setInterval(() => {
        progress += 0.05;
        if (progress >= 1) {
          clearInterval(interval);
          p1.setAttribute('cx', '300');
          p1.setAttribute('cy', '150');
          handleDeviceProcessing(dev, traffic, packetsGroup, statusText, statusBadge, btn, p1);
        } else {
          const curX = 80 + (300 - 80) * progress;
          const curY = 70 + (150 - 70) * progress;
          p1.setAttribute('cx', curX);
          p1.setAttribute('cy', curY);
        }
      }, 30);
    }

    function handleDeviceProcessing(dev, traffic, packetsGroup, statusText, statusBadge, btn, p1) {
      if (dev === 'hub') {
        statusText.innerHTML = `<span class="text-amber-400 font-bold">HUB (L1):</span> Repetindo os bits cegamente para TODAS as outras portas (PC2, PC3, WAN). Não há inteligência de destino!`;
        statusBadge.innerText = 'Inundação (Broadcast)';
        statusBadge.className = 'px-2 py-0.5 rounded text-[10px] font-mono bg-amber-500/20 text-amber-400';

        // Replicate packets to PC2 (80, 230), PC3 (520, 70), WAN (520, 230)
        spawnAndAnimate(packetsGroup, 300, 150, 80, 230, '#f59e0b');
        spawnAndAnimate(packetsGroup, 300, 150, 520, 70, '#f59e0b');
        spawnAndAnimate(packetsGroup, 300, 150, 520, 230, '#f59e0b', () => {
          btn.disabled = false;
        });
      } 
      else if (dev === 'switch') {
        if (traffic === 'p1_to_wan') {
          statusText.innerHTML = `<span class="text-sky-400 font-bold">SWITCH (L2):</span> Pacote destinado a IP externo. Encaminhado ao Gateway padrão (Porta WAN).`;
          spawnAndAnimate(packetsGroup, 300, 150, 520, 230, '#38bdf8', () => { btn.disabled = false; });
        } else {

    function spawnAndAnimate(parent, startX, startY, endX, endY, color, onComplete) {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      p.setAttribute('cx', startX);
      p.setAttribute('cy', startY);
      p.setAttribute('r', '6');
      p.setAttribute('fill', color);
      p.setAttribute('filter', 'drop-shadow(0 0 5px currentColor)');
      parent.appendChild(p);

      let step = 0;
      const anim = setInterval(() => {
        step += 0.05;
        if (step >= 1) {
          clearInterval(anim);
          p.setAttribute('cx', endX);
          p.setAttribute('cy', endY);
          if (onComplete) onComplete();
        } else {
          p.setAttribute('cx', startX + (endX - startX) * step);
          p.setAttribute('cy', startY + (endY - startY) * step);
        }
      }, 30);
    }

    // State for Module 10 Binary Converter
    let currentBits = [0, 0, 0, 0, 0, 0, 0, 0];
    const BIT_WEIGHTS = [128, 64, 32, 16, 8, 4, 2, 1];

    MODULE_INITS[10] = function() {
      updateBitUI();
      analyzeCustomIP();
    };

    function toggleBit(index) {
      currentBits[index] = currentBits[index] === 0 ? 1 : 0;
      updateBitUI();
    }

    function resetBits() {
      currentBits = [0, 0, 0, 0, 0, 0, 0, 0];
      updateBitUI();
    }

    function updateBitUI() {
      let sum = 0;
      let formulaParts = [];

      currentBits.forEach((bit, i) => {
        const valEl = document.getElementById(`bit-val-${i}`);
        const boxEl = document.getElementById(`bit-box-${i}`);
        const subEl = document.getElementById(`bit-sub-${i}`);
        const weight = BIT_WEIGHTS[i];

        if (bit === 1) {
          sum += weight;
          if (valEl) {
            valEl.innerText = '1';
            valEl.className = 'w-9 h-9 rounded-xl bg-emerald-500 text-slate-950 flex items-center justify-center font-mono font-black text-lg my-2 border border-emerald-400 shadow-lg shadow-emerald-500/20';
          }
          if (boxEl) boxEl.className = 'cursor-pointer select-none p-3 rounded-2xl bg-emerald-950/40 border border-emerald-500 flex flex-col items-center justify-center transition-all scale-105';
          if (subEl) {
            subEl.innerText = `+${weight}`;
            subEl.className = 'text-[10px] text-emerald-300 font-mono font-bold';
          }
          formulaParts.push(`<span class="text-emerald-300 font-bold">${weight}</span>`);
        } else {
          if (valEl) {
            valEl.innerText = '0';
            valEl.className = 'w-9 h-9 rounded-xl bg-slate-800 text-slate-400 flex items-center justify-center font-mono font-black text-lg my-2 border border-slate-700';
          }
          if (boxEl) boxEl.className = 'cursor-pointer select-none p-3 rounded-2xl bg-slate-950 border border-slate-800 hover:border-emerald-500/50 flex flex-col items-center justify-center transition-all';
          if (subEl) {
            subEl.innerText = '+0';
            subEl.className = 'text-[10px] text-slate-500 font-mono';
          }
          formulaParts.push('0');
        }
      });

      const decEl = document.getElementById('total-decimal');
      const formEl = document.getElementById('calc-formula');
      if (decEl) decEl.innerText = sum;
      if (formEl) formEl.innerHTML = `${formulaParts.join(' + ')} = <strong class="text-white">${sum}</strong>`;
    }

    function analyzeCustomIP() {
      const input = document.getElementById('ip-analyzer-input');
      const resultsContainer = document.getElementById('analyzer-results');
      const binaryFullContainer = document.getElementById('ip-full-binary');
      if (!input || !resultsContainer) return;

      const ipStr = input.value.trim();
      const parts = ipStr.split('.');

      if (parts.length !== 4 || parts.some(p => isNaN(p) || p === '' || parseInt(p) < 0 || parseInt(p) > 255)) {
        resultsContainer.innerHTML = `
          <div class="col-span-full p-4 rounded-xl bg-rose-950/30 border border-rose-500/30 text-rose-300 text-xs">
            ⚠️ Formato de IPv4 inválido! Digite 4 octetos decimais entre 0 e 255 separados por ponto (Ex: 172.16.254.1).
          </div>
        `;
        return;
      }

      const octets = parts.map(p => parseInt(p));
      const first = octets[0];

      // Identify class
      let ipClass = 'Desconhecida';
      let defaultMask = 'N/A';
      if (first >= 1 && first <= 126) { ipClass = 'Classe A'; defaultMask = '255.0.0.0 (/8)'; }
      else if (first === 127) { ipClass = 'Loopback Local'; defaultMask = '255.0.0.0 (/8)'; }
      else if (first >= 128 && first <= 191) { ipClass = 'Classe B'; defaultMask = '255.255.0.0 (/16)'; }
      else if (first >= 192 && first <= 223) { ipClass = 'Classe C'; defaultMask = '255.255.255.0 (/24)'; }
      else if (first >= 224 && first <= 239) { ipClass = 'Classe D (Multicast)'; defaultMask = 'Não aplicável'; }
      else if (first >= 240 && first <= 255) { ipClass = 'Classe E (Experimental)'; defaultMask = 'Não aplicável'; }

      // Identify Scope
      let scope = 'Público (Roteável na Internet Global)';
      let scopeColor = 'text-sky-400';
      if (first === 10) {
        scope = 'Privado (RFC 1918 - Rede Local)';
        scopeColor = 'text-emerald-400';
      } else if (first === 172 && octets[1] >= 16 && octets[1] <= 31) {
        scope = 'Privado (RFC 1918 - Rede Local)';
        scopeColor = 'text-emerald-400';
      } else if (first === 192 && octets[1] === 168) {
        scope = 'Privado (RFC 1918 - Rede Local)';
        scopeColor = 'text-emerald-400';
      } else if (first === 127) {
        scope = 'Loopback / Localhost (Interno do Host)';
        scopeColor = 'text-indigo-400';
      } else if (first === 169 && octets[1] === 254) {
        scope = 'APIPA / Link-Local (Sem DHCP)';
        scopeColor = 'text-amber-400';
      }

      const binaryOctets = octets.map(o => o.toString(2).padStart(8, '0'));
      if (binaryFullContainer) {
        binaryFullContainer.innerHTML = binaryOctets.map(b => `<span class="bg-slate-900 px-2 py-1 rounded border border-slate-800 text-sky-300">${b}</span>`).join(' . ');
      }

      resultsContainer.innerHTML = `
        <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-400">Classificação</span>
          <div class="text-base font-bold text-white mt-1">${ipClass}</div>
          <span class="text-[11px] text-slate-500 font-mono mt-0.5 block">Baseado no 1º octeto (${first})</span>
        </div>
        <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-400">Escopo / Visibilidade</span>
          <div class="text-sm font-bold ${scopeColor} mt-1">${scope}</div>
          <span class="text-[11px] text-slate-500 font-mono mt-0.5 block">Norma IANA / RFC</span>
        </div>
        <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-400">Máscara Padrão (Classful)</span>
          <div class="text-sm font-bold text-slate-200 mt-1 font-mono">${defaultMask}</div>
          <span class="text-[11px] text-slate-500 font-mono mt-0.5 block">Sem sub-rede adicional</span>
        </div>
        <div class="p-4 rounded-xl bg-slate-950 border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-400">Notação Hexadecimal</span>
          <div class="text-sm font-bold text-amber-300 mt-1 font-mono">0x${octets.map(o => o.toString(16).padStart(2, '0').toUpperCase()).join('')}</div>
          <span class="text-[11px] text-slate-500 font-mono mt-0.5 block">Valor em memória</span>
        </div>

    function recalcSubnet() {
      const { octets, cidr } = subnetState;

      // Update bit flip display for the 4 octets
      for (let i = 0; i < 4; i++) {
        const bitContainer = document.getElementById(`ip-bits-oct-${i}`);
        if (bitContainer) {
          const binStr = octets[i].toString(2).padStart(8, '0');
          bitContainer.innerHTML = binStr.split('').map((bit, bitIdx) => {
            const globalBitIdx = i * 8 + bitIdx;
            const isNet = globalBitIdx < cidr;
            return `<span class="px-1 py-0.5 rounded ${isNet ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'}">${bit}</span>`;
          }).join('');
        }
      }

      // Counts
      const netBits = cidr;
      const hostBits = 32 - cidr;
      const countNetEl = document.getElementById('count-net-bits');
      const countHostEl = document.getElementById('count-host-bits');
      if (countNetEl) countNetEl.innerText = `(${netBits} bits)`;
      if (countHostEl) countHostEl.innerText = `(${hostBits} bits)`;

      // Render 32 bit strip
      const stripContainer = document.getElementById('full-32-bits-container');
      if (stripContainer) {
        let stripHtml = '';
        for (let i = 0; i < 32; i++) {
          const octIdx = Math.floor(i / 8);
          const bitWithinOct = i % 8;
          const bitVal = (octets[octIdx] >> (7 - bitWithinOct)) & 1;
          const isNet = i < cidr;
          stripHtml += `
            <div title="Bit ${i+1}: ${isNet ? 'Rede' : 'Host'}" class="flex-1 min-w-[12px] h-9 rounded flex flex-col items-center justify-center text-[10px] font-mono font-bold transition-all ${
              isNet ? 'bg-sky-500/30 text-sky-200 border border-sky-500/50' : 'bg-emerald-500/30 text-emerald-200 border border-emerald-500/50'
            } ${i % 8 === 7 && i !== 31 ? 'mr-1.5' : ''}">
              ${bitVal}
            </div>
          `;
        }
        stripContainer.innerHTML = stripHtml;
      }

      // Convert IP to 32-bit unsigned integer
      const ipInt = ((octets[0] << 24) >>> 0) + ((octets[1] << 16) >>> 0) + ((octets[2] << 8) >>> 0) + (octets[3] >>> 0);
      const maskInt = cidr === 0 ? 0 : (~0 << (32 - cidr)) >>> 0;
      const wildcardInt = ~maskInt >>> 0;

      const netInt = (ipInt & maskInt) >>> 0;
      const bcastInt = (netInt | wildcardInt) >>> 0;

      const intToIp = (val) => [
        (val >>> 24) & 255,
        (val >>> 16) & 255,
        (val >>> 8) & 255,
        val & 255
      ].join('.');

      const netAddr = intToIp(netInt);
      const bcastAddr = intToIp(bcastInt);
      const maskDec = intToIp(maskInt);
      const wildcardDec = intToIp(wildcardInt);

      let totalAddresses = Math.pow(2, hostBits);
      let usableHosts = hostBits <= 1 ? 0 : totalAddresses - 2;
      let firstHost = hostBits <= 1 ? 'N/A' : intToIp(netInt + 1);
      let lastHost = hostBits <= 1 ? 'N/A' : intToIp(bcastInt - 1);

      // DOM updates
      const setEl = (id, txt) => { const el = document.getElementById(id); if (el) el.innerText = txt; };
      setEl('calc-net-addr', netAddr);
      setEl('calc-first-host', firstHost);
      setEl('calc-last-host', lastHost);
      setEl('calc-bcast-addr', bcastAddr);
      setEl('calc-mask-dec', maskDec);
      setEl('calc-wildcard', wildcardDec);
      setEl('calc-usable-hosts', usableHosts.toLocaleString());
      setEl('calc-formula-hosts', `2^${hostBits} - 2 = ${usableHosts.toLocaleString()}`);
    }

      statsLabel.innerText = `${numSubnets} Sub-rede${numSubnets > 1 ? 's' : ''} (/ ${currentCidr}) | ${hostsPerSubnet} Hosts úteis cada`;

      const colors = [
        'bg-sky-500/30 border-sky-400 text-sky-200',

      const blockSize = 256 / numSubnets;

        if (btn) {

          btn.className = match ? "px-3 py-1 rounded-lg text-xs font-bold bg-cyan-500 text-slate-950" : "px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white";

      });

      const q1Rect = document.getElementById('dev-quarto1-rect');

      if (band === '2.4') {
        diagnosis.innerHTML = `

        if (escRect) escRect.setAttribute('stroke', '#ef4444');
      } else {
        diagnosis.innerHTML = `

        `;
        if (q1Rect) q1Rect.setAttribute('stroke', '#ef4444');
        if (escRect) escRect.setAttribute('stroke', '#64748b');
      }

      startWaveAnimation(band);
    }

    function startWaveAnimation(band) {
      const container = document.getElementById('rf-waves-group');
      if (!container) return;
      if (rfInterval) clearInterval(rfInterval);
      container.innerHTML = '';

      const color = band === '2.4' ? '#f59e0b' : band === '5.0' ? '#38bdf8' : '#818cf8';
      let r = 10;

      rfInterval = setInterval(() => {
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
          const currentRadius = (r + i * 35) % 250;
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', '120');
          circle.setAttribute('cy', '160');
          circle.setAttribute('r', currentRadius);
          circle.setAttribute('fill', 'none');
          circle.setAttribute('stroke', color);
          circle.setAttribute('stroke-width', band === '2.4' ? '2.5' : '1.5');
          circle.setAttribute('stroke-opacity', Math.max(0.1, 1 - (currentRadius / 250)));
          container.appendChild(circle);
        }
        r += 3;
      }, 50);
    }

      const rawCmd = input.value.trim();

    function runCipherSimulator() {

      if (!input || !output) return;

      const val = input.value;
      // Simulated AES base64 hashing

      for (let i = 0; i < val.length; i++) {

        hash += (code * 31).toString(16).toUpperCase();
      }
      output.innerText = 'ENC_AES256$' + (hash || 'VAZIO') + '==';

  <script>
    // ===== GLOSSÁRIO DE TERMOS TÉCNICOS COM TOOLTIPS =====
    const GLOSSARY = {

      'Switch': 'Dispositivo de rede (camada 2) que conecta múltiplos dispositivos em uma LAN e encaminha os dados apenas para o destinatário correto usando a tabela MAC.',

      'MU-MIMO': 'Multi-User MIMO — evolução do MIMO que permite comunicação simultânea com múltiplos dispositivos, em vez de um por vez.',
      'Beamforming': 'Técnica de focalização do sinal WiFi na direção do dispositivo receptor, em vez de transmitir igualmente em todas as direções. Melhora alcance e velocidade.',
      'QAM': 'Quadrature Amplitude Modulation — técnica de modulação que combina amplitude e fase para transmitir mais bits por símbolo. WiFi 6 usa 1024-QAM.',

      'Dragonfly SAE': 'Simultaneous Authentication of Equals — protocolo de handshake do WPA3 que oferece proteção contra ataques de dicionário offline, mais seguro que o PSK do WPA2.',
    };

    function applyTooltips() {
      const contentArea = document.getElementById('module-content') || document.getElementById('content-container');
      if (!contentArea) return;

      const sortedTerms = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
      const regexPattern = sortedTerms.map(t => t.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&')).join('|');
      const regex = new RegExp(`\\b(${regexPattern})\\b`, 'gi');
      
      const walker = document.createTreeWalker(contentArea, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          if (node.parentElement && (
            node.parentElement.classList.contains('tech-term') ||
            node.parentElement.tagName === 'SCRIPT' ||
            node.parentElement.tagName === 'STYLE' ||
            node.parentElement.tagName === 'CODE' ||
            node.parentElement.tagName === 'BUTTON' ||
            node.parentElement.tagName === 'INPUT' ||
            node.parentElement.closest('.tech-tooltip') ||
            node.parentElement.closest('button') ||
            node.parentElement.closest('svg') ||
            node.parentElement.closest('.terminal-cursor')
          )) return NodeFilter.FILTER_REJECT;
          return regex.test(node.textContent) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      
      const applied = new Set();
      
      textNodes.forEach(textNode => {
        regex.lastIndex = 0;
        const text = textNode.textContent;
        const parts = [];
        let lastIndex = 0;
        
        const localRegex = new RegExp(`\\b(${regexPattern})\\b`, 'gi');
        let match;
        while ((match = localRegex.exec(text)) !== null) {
          const term = match[1];
          const key = Object.keys(GLOSSARY).find(k => k.toLowerCase() === term.toLowerCase());
          if (!key || applied.has(key.toLowerCase())) continue;
          
          if (match.index > lastIndex) {
            parts.push(document.createTextNode(text.slice(lastIndex, match.index)));
          }
          
          const span = document.createElement('span');
          span.className = 'tech-term';
          span.textContent = term;
          
          const tooltip = document.createElement('span');
          tooltip.className = 'tech-tooltip';
          tooltip.innerHTML = `<span class="tooltip-title">${key}</span>${GLOSSARY[key]}`;
          span.appendChild(tooltip);
          
          parts.push(span);
          lastIndex = match.index + match[0].length;
          applied.add(key.toLowerCase());
        }
        
        if (parts.length > 0) {
          if (lastIndex < text.length) {
            parts.push(document.createTextNode(text.slice(lastIndex)));
          }
          const frag = document.createDocumentFragment();
          parts.forEach(p => frag.appendChild(p));
          textNode.parentNode.replaceChild(frag, textNode);
        }
      });
    }

    // Apply tooltips after page load and on module changes
    const origLoadModule = window.loadModule;
    if (origLoadModule) {
      window.loadModule = function(id) {
        origLoadModule(id);
        setTimeout(applyTooltips, 400);
      };
    }
    window.addEventListener('load', () => setTimeout(applyTooltips, 600));
  </script>
