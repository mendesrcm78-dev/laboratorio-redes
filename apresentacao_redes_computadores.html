            <h3>O Que São Sub-redes?</h3>
            <p>Sub-redes (ou subnets) são <strong>divisões lógicas de uma rede maior em redes menores</strong>. Usadas para organização, segurança e melhor desempenho.</p>

            <div class="info-box">
              <h4>💡 Por Que Sub-redes?</h4>
              <p>Imagine uma empresa com 100 funcionários: TI, RH, Vendas, Diretoria. Faz sentido todos estarem na MESMA rede? <strong>Não!</strong></p>
              <p>Com sub-redes:<br>
              • <strong>192.168.1.0/24</strong> → TI<br>
              • <strong>192.168.2.0/24</strong> → RH<br>
              • <strong>192.168.3.0/24</strong> → Vendas<br>
              • <strong>192.168.4.0/24</strong> → Diretoria</p>

            </div>

            <h3>Recursos para Continuar Aprendendo</h3>
            <ul>
              <li><strong>YouTube:</strong> Bóson Treinamentos, Curso em Vídeo, Linuxtips</li>
              <li><strong>Cursos online:</strong> Alura, Udemy, Cisco NetAcad (gratuito)</li>
              <li><strong>Livros:</strong> "Redes de Computadores" de Tanenbaum; "Top-Down" de Kurose</li>
              <li><strong>Simuladores:</strong> Cisco Packet Tracer, GNS3, EVE-NG</li>
              <li><strong>Comunidades:</strong> Reddit r/networking, fóruns brasileiros, LinkedIn</li>
              <li><strong>Eventos:</strong> Mikrotik User Meeting (MUM), Futurecom, Campus Party</li>
            </ul>
          `
        }
      ]
    }
  ]
};

// ============================ APP LOGIC ============================

let currentModule = 0;
let currentLesson = 0;

function renderMenu() {
  const menu = document.getElementById('menu');
  menu.innerHTML = curso.modulos.map((mod, mi) => `
    <div class="module ${mi === 0 ? 'open' : ''}" id="mod-${mi}">
      <div class="module-header" onclick="toggleModule(${mi})">
        <span>${mod.nome}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="lessons">
        ${mod.aulas.map((aula, ai) => `
          <div class="lesson ${mi === 0 && ai === 0 ? 'active' : ''}"
               onclick="showLesson(${mi}, ${ai})"
               id="lesson-${mi}-${ai}">
            ${aula.titulo}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleModule(mi) {
  document.getElementById(`mod-${mi}`).classList.toggle('open');
}

function showLesson(mi, ai) {
  currentModule = mi;
  currentLesson = ai;
  document.querySelectorAll('.lesson').forEach(l => l.classList.remove('active'));
  document.getElementById(`lesson-${mi}-${ai}`).classList.add('active');
  document.getElementById(`mod-${mi}`).classList.add('open');

  const aula = curso.modulos[mi].aulas[ai];
  const totalAulas = curso.modulos.reduce((s, m) => s + m.aulas.length, 0);
  let aulaIndex = 0;
  for (let i = 0; i < mi; i++) aulaIndex += curso.modulos[i].aulas.length;
  aulaIndex += ai + 1;
  const progress = Math.round((aulaIndex / totalAulas) * 100);

  document.getElementById('content').innerHTML = `
    <div class="slide">
      <div class="slide-header">
        <span class="slide-tag">${aula.tag}</span>
        <h2>${aula.titulo}</h2>
        <p class="slide-subtitle">Aula ${aulaIndex} de ${totalAulas}</p>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      </div>
      ${aula.conteudo}
      <div class="nav-buttons">
        <button class="btn" onclick="prevLesson()" ${aulaIndex === 1 ? 'disabled' : ''}>← Aula Anterior</button>
        <button class="btn" onclick="nextLesson()" ${aulaIndex === totalAulas ? 'disabled' : ''}>Próxima Aula →</button>
      </div>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextLesson() {
  const mod = curso.modulos[currentModule];
  if (currentLesson < mod.aulas.length - 1) {
    showLesson(currentModule, currentLesson + 1);
  } else if (currentModule < curso.modulos.length - 1) {
    showLesson(currentModule + 1, 0);
  }
}

function prevLesson() {
  if (currentLesson > 0) {
    showLesson(currentModule, currentLesson - 1);
  } else if (currentModule > 0) {
    const prevMod = curso.modulos[currentModule - 1];
    showLesson(currentModule - 1, prevMod.aulas.length - 1);
  }
}

function checkAnswer(el, correct) {
  el.parentNode.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('correct', 'wrong'));
  el.classList.add(correct ? 'correct' : 'wrong');
}

renderMenu();
showLesson(0, 0);
</script>
