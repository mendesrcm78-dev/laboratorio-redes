  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #0b1120;
      --card: #151f32;
      --card-hover: #1e2c47;
      --border: #233554;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --secondary: #818cf8;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #080d1a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #233554; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

    /* Tooltips para termos técnicos */
    .tech-term {
      position: relative;
      cursor: help;
      border-bottom: 1px dashed #38bdf8;
      color: #7dd3fc;
      transition: all 0.2s ease;
    }
    .tech-term:hover { color: #38bdf8; }
    .tech-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 240px;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
      font-size: 11px;
      line-height: 1.45;
      color: #cbd5e1;
    }
    .tech-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(56, 189, 248, 0.4);
    }
    .tech-tooltip-title {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .tech-term:hover .tech-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    /* Terminal blinking cursor */
    .term-cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: #38bdf8;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>

        content: `
          <div class="space-y-6">

                  <tr class="hover:bg-slate-800/40"><td class="p-3 font-bold text-indigo-400 font-mono">CAN</td><td class="p-3">Campus Area Network</td><td class="p-3 font-mono">1 a 5 km</td><td class="p-3">Interligação de blocos e faculdades universitárias.</td></tr>
                  <tr class="hover:bg-slate-800/40"><td class="p-3 font-bold text-amber-400 font-mono">MAN</td><td class="p-3">Metropolitan Area Network</td><td class="p-3 font-mono">5 a 50 km</td><td class="p-3">Anel de fibra óptica cobrindo uma cidade inteira.</td></tr>
                  <tr class="hover:bg-slate-800/40"><td class="p-3 font-bold text-rose-400 font-mono">WAN</td><td class="p-3">Wide Area Network</td><td class="p-3 font-mono">Global (> 50 km)</td><td class="p-3">A Internet e enlaces submarinos continentais.</td></tr>

        desc: "Cobre (Par Trançado, Coaxial), Fibra Monomodo/Multimodo, Wireless, PLC, Li-Fi, Atenuação e NEXT.",

    let currentModuleId = 1;
    let isSlideMode = false;

    function renderModuleMenu() {
      const menu = document.getElementById('modules-menu');
      if (!menu) return;
      menu.innerHTML = COURSE_MODULES.map(m => `
        <button onclick="selectModule(${m.id})" class="w-full text-left p-3 rounded-xl transition flex items-start gap-3 border ${
          m.id === currentModuleId 
            ? 'bg-sky-500/15 border-sky-500/50 text-white shadow-lg shadow-sky-500/10' 
            : 'border-transparent text-slate-300 hover:bg-slate-800/60 hover:text-white'
        }">
          <span class="text-lg shrink-0 mt-0.5">${m.icon}</span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold truncate ${m.id === currentModuleId ? 'text-sky-300' : 'text-slate-200'}">${m.title}</div>
            <div class="text-[11px] text-slate-400 truncate mt-0.5">${m.desc}</div>
          </div>
        </button>
      `).join('');
    }

    function selectModule(id) {
      currentModuleId = id;
      renderModuleMenu();
      const mod = COURSE_MODULES.find(m => m.id === id);
      const viewport = document.getElementById('active-content');
      if (mod && viewport) {
        viewport.innerHTML = mod.content;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Inicializadores específicos
        if (id === 7) testIPAddress();
        if (id === 9) setWifiBandwidth(20);
      }
    }

    function toggleViewMode() {
      isSlideMode = !isSlideMode;
      const label = document.getElementById('view-mode-label');
      const btn = document.getElementById('view-mode-btn');
      const viewport = document.getElementById('active-content');
      if (isSlideMode) {
        label.innerText = 'Modo Projetor (Slides)';
        btn.className = 'px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs transition flex items-center gap-1.5';
        viewport.classList.add('text-lg');
      } else {
        label.innerText = 'Modo Leitura';
        btn.className = 'px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-300 transition flex items-center gap-1.5';
        viewport.classList.remove('text-lg');
      }
    }

    function filterTopics(query) {
      query = query.toLowerCase().trim();
      if (!query) {
        renderModuleMenu();
        return;
      }
      const menu = document.getElementById('modules-menu');
      const filtered = COURSE_MODULES.filter(m => 
        m.title.toLowerCase().includes(query) || 
        m.desc.toLowerCase().includes(query) ||
        m.content.toLowerCase().includes(query)
      );
      if (filtered.length > 0) {
        menu.innerHTML = filtered.map(m => `
          <button onclick="selectModule(${m.id})" class="w-full text-left p-3 rounded-xl transition flex items-start gap-3 border border-sky-500/30 bg-sky-950/20 text-white">
            <span class="text-lg shrink-0 mt-0.5">${m.icon}</span>
            <div class="min-w-0 flex-1">
              <div class="text-xs font-bold text-sky-300">${m.title}</div>
              <div class="text-[11px] text-slate-400 truncate mt-0.5">${m.desc}</div>
            </div>
          </button>
        `).join('');
      } else {
        menu.innerHTML = `<div class="p-4 text-xs text-slate-500 text-center">Nenhum tópico encontrado para "${query}"</div>`;
      }
    }

    // =========================================================================
    // SIMULADOR 2: CLASSIFICADOR DE IP (CLASSES A, B, C, D, E)
    // =========================================================================
    function testIPAddress() {
      const input = document.getElementById('ip-test-input');
      const res = document.getElementById('ip-test-result');
      if (!input || !res) return;

      const ip = input.value.trim();
      const parts = ip.split('.').map(p => parseInt(p, 10));

      if (parts.length !== 4 || parts.some(p => isNaN(p) || p < 0 || p > 255)) {
        res.innerHTML = '<span class="text-rose-400 font-bold">⚠️ Formato de IPv4 inválido! Digite 4 octetos de 0 a 255 (Ex: 192.168.1.1).</span>';
        return;
      }

      const oct1 = parts[0];
      let classe = '';
      let mask = '';
      let desc = '';
      let escopo = 'Público (Roteável na Internet)';

      // Checa Loopback
      if (oct1 === 127) {
        classe = 'Loopback Local (127.0.0.0/8)';
        mask = '255.0.0.0';
        escopo = 'Teste Local Interno (Não trafega no cabo)';
        desc = 'Destinado exclusivamente para teste da pilha TCP/IP do próprio computador.';
      } else if (oct1 >= 1 && oct1 <= 126) {
        classe = 'Classe A';
        mask = '255.0.0.0 (/8)';
        desc = '16.777.214 computadores por rede. 1º bit sempre 0.';
        if (oct1 === 10) escopo = 'Privado RFC 1918 (Rede interna de grande porte)';
      } else if (oct1 >= 128 && oct1 <= 191) {
        classe = 'Classe B';
        mask = '255.255.0.0 (/16)';
        desc = '65.534 computadores por rede. Primeiros 2 bits: 10.';
        if (oct1 === 172 && parts[1] >= 16 && parts[1] <= 31) escopo = 'Privado RFC 1918 (Rede interna corporativa)';
      } else if (oct1 >= 192 && oct1 <= 223) {
        classe = 'Classe C';
        mask = '255.255.255.0 (/24)';
        desc = '254 computadores por rede. Primeiros 3 bits: 110.';
        if (oct1 === 192 && parts[1] === 168) escopo = 'Privado RFC 1918 (Rede local doméstica/comercial)';
      } else if (oct1 >= 224 && oct1 <= 239) {
        classe = 'Classe D (Multicast)';
        mask = 'N/A';
        escopo = 'Transmissão seletiva para grupo de dispositivos';
        desc = 'Usado em conferências de vídeo e telemetria de roteamento.';
      } else {
        classe = 'Classe E (Experimental / Testes Futuros)';
        mask = 'N/A';
        escopo = 'Reservado por IETF para pesquisa';
        desc = 'Anotação do professor: reservado para testes futuros.';
      }

      res.innerHTML = `
        <div class="text-white">IP Analisado: <strong class="text-sky-400">${ip}</strong></div>
        <div class="text-emerald-400">Classificação: <strong>${classe}</strong></div>
        <div class="text-slate-300">Máscara Padrão: <strong>${mask}</strong></div>
        <div class="text-indigo-300">Escopo de Roteamento: <strong>${escopo}</strong></div>
        <div class="text-slate-400 mt-1">${desc}</div>
      `;
    }
